<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="register()" #registerForm="ngForm">
    <div class="form-group">
      <label for="username">Username (Optional):</label>
      <input type="text" id="username" name="username" [(ngModel)]="userData.username">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="userData.email" required email #emailInput="ngModel">
      <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-message">
        <div *ngIf="emailInput.errors?.['required']">Email is required.</div>
        <div *ngIf="emailInput.errors?.['email']">Please enter a valid email.</div>
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" [(ngModel)]="userData.password" required minlength="6" #passwordInput="ngModel">
      <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error-message">
        <div *ngIf="passwordInput.errors?.['required']">Password is required.</div>
        <div *ngIf="passwordInput.errors?.['minlength']">Password must be at least 6 characters long.</div>
      </div>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="userData.confirmPassword" required #confirmPasswordInput="ngModel">
      <div *ngIf="confirmPasswordInput.dirty && userData.password !== userData.confirmPassword" class="error-message">
        Passwords do not match.
      </div>
    </div>
    <button type="submit" [disabled]="registerForm.invalid || (userData.password !== userData.confirmPassword && confirmPasswordInput.dirty)">Register</button>
  </form>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="error-message api-error">
    {{ errorMessage }}
  </div>
  <p>
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
